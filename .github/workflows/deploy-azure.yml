name: deploy-azure

# Passwordless deploy to Azure App Service (Cloud Security Lab, Part D).
# Login uses OIDC: GitHub issues a short-lived token and Azure trusts it only for
# the federated credential subject repo:Civza/smart-bussing-back:ref:refs/heads/staging.
# No client secret is stored anywhere.

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (tests run in tests.yml)
        run: ./mvnw -B -DskipTests package

      - name: Rename JAR to match the App Service startup command
        run: cp target/smartbussingAPI-0.0.1-SNAPSHOT.jar target/app.jar

      - name: Azure login (OIDC, no password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: smartbussing-lab-6266
          package: target/app.jar
