name: tests.yml
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: smartbuss_test
          POSTGRES_USER: smartbusser
          POSTGRES_PASSWORD: bussword

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

        ports:
          - 5433:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up java 25
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install PostgreSQL 17 client
      run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
    - name: Verify Dump version
      run : /usr/lib/postgresql/17/bin/pg_dump --version
    - name: SQL Dump
      run: |
        sleep 5
        PGSSLMODE=require /usr/lib/postgresql/17/bin/pg_dump --schema-only --no-privileges --no-owner --schema=public "$DB_URL" | grep -v 'CREATE SCHEMA public' > database/schema_backup.sql
      env:
        DB_URL: ${{ secrets.DB_URL }}
    - name: Load database schema
      run: |
          sleep 5
          psql -h localhost -p 5433 -U smartbusser -d smartbuss_test -f database/schema_backup.sql
      env:
        PGPASSWORD: bussword
    - name: Verify database schema loaded
      run: psql -h localhost -p 5433 -U smartbusser -d smartbuss_test -c "\dt"
      env:
        PGPASSWORD: bussword
    - name: Run unit tests + integration tests
      run: mvn clean verify "-Dspring.config.name=application-test"
      env:
        MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 7