spring.application.name=smartbussingAPI

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
mapbox.token=${MAPBOX_API_KEY}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=5

# Mitigacion de Information Exposure (CWE-209): Sanitizacion de errores al cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

logging.file.name=logs/smart-bussing.json
dlp.service.url=${DLP_SERVICE_URL:http://localhost:8000/api/dlp/scan}
