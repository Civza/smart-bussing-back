spring.application.name=smartbussingAPI

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
mapbox.token=${MAPBOX_API_KEY}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=5

# Mitigacion de Information Exposure (CWE-209): Sanitizacion de errores al cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

logging.file.name=logs/smart-bussing.json
dlp.service.url=${DLP_SERVICE_URL:http://localhost:8000/api/dlp/scan}

# Autenticacion (KAN-21). Tokens propios HS256 + tokens de Supabase (Google) verificados por JWKS.
# APP_JWT_SECRET: >= 32 bytes aleatorios (openssl rand -base64 48). SUPABASE_URL: https://<ref>.supabase.co
smartbussing.security.jwt.secret=${APP_JWT_SECRET}
smartbussing.security.jwt.issuer=smart-bussing-api
smartbussing.security.jwt.ttl=PT1H
smartbussing.security.supabase.url=${SUPABASE_URL}
smartbussing.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://smart-bussing.vercel.app}
