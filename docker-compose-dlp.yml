version: '3.8'

services:
  dlp-service:
    build:
      context: ./dlp-service
      dockerfile: Dockerfile
    container_name: smart-bussing-dlp
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - smart-bussing-net

  # Si deseas correr la API completa en Docker:
  # api:
  #   build: .
  #   container_name: smart-bussing-api
  #   ports:
  #     - "8080:8080"
