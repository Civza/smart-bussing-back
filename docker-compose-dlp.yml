  #     - DLP_SERVICE_URL=http://dlp-service:8000/api/dlp/scan
  #   volumes:
  #     - ./logs:/app/logs
  #   networks:
  #     - smart-bussing-net

networks:
  smart-bussing-net:
    driver: bridge
