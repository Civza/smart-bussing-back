version: '3.9'

services:
  schema-dump:
    image: node:20-alpine
    container_name: smartbussing_schema_dump
    environment:
      DB_URL: ${SPRING_DATASOURCE_URL}
    volumes:
      - ./database:/database
    command: >
      sh -c "npm install -g supabase --silent &&
             sleep 5 &&
             npx supabase db dump --db-url \"$$SPRING_DATASOURCE_URL\" -s public -f /database/schema_backup.sql"

  postgres-test:
    image: postgres:15
    container_name: smartbussing_test_container
    depends_on:
      schema-dump:
        condition: service_completed_successfully

    environment:
      POSTGRES_DB: smartbuss_test
      POSTGRES_USER: smartbusser
      POSTGRES_PASSWORD: bussword

    ports:
      - "5433:5432"

    volumes:
      - ./database/schema_backup.sql:/docker-entrypoint-initdb.d/01-schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbusser -d smartbuss_test"]
      interval: 2s
      timeout: 5s
      retries: 5